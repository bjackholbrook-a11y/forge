}

/* one result row — the source label is the point */
function rowCard(r){
  const n=r.nutrients||{};
  const per=r.per==='100g'?'100 g':(r.serving||'1 serving');
  const brand=r.brand?` · ${escHtml(r.brand)}`:'';
  const cls=r.source==='estimate'?'est':(r.source==='web'?'web':'');
  return `<button class="foodrow ${cls}" onclick="openFoodDetail('${r.id}')">
    <div class="fr-top">
      <span class="fr-name">${escHtml(r.name)}</span>
      ${srcBadge(r)}
    </div>
    <div class="fr-macros">${Math.round(n.calories||0)} cal · ${Math.round(n.protein||0)}g P · ${Math.round(n.carbs||0)}g C · ${Math.round(n.fat||0)}g F
      <span class="fr-per">/ ${escHtml(per)}</span>${brand}</div>
  </button>`;
}
function srcBadge(r){
  const map={
    usda:['conf-verified','USDA'],
    usda_branded:['conf-verified','USDA label'],
    off:['conf-off','Open Food Facts'],
    staple:['conf-staple','Saved'],
    yours:['conf-staple','Yours'],
    web:['conf-published',r.sourceLabel||'Brand site'],
    estimate:['conf-estimated','~ Estimate'],
  };
  const [cls,label]=map[r.source]||['conf-off',r.sourceLabel||''];
  // Prefer a specific label the row carries (history rows know whether the
  // original entry was verified, estimated, or the user's own) over the
  // generic one keyed off source.
  return `<span class="conf ${cls}">${escHtml(r.sourceLabel||label)}</span>`;
}

/* ---- the search itself ---- */
async function runFoodSearch(more){
  const q=(fpQuery||'').trim();
  if(!q){fpState='idle';renderFoodPicker();return;}
  const seq=++fpSeq;

  if(more){
    // paging the current database query
    fpMoreLoading=true;renderFoodPicker();
    await dbPage(fpLastDbQuery||q,seq,true);
    return;
  }

  fpRows=[];fpPage=0;fpHasMore=false;fpAiState='';fpState='loading';fpInterp=null;
  renderFoodPicker();

  // 1. Ask Claude what this actually is. Fast, and it decides where to look.
  let items=null;
  try{
    const r=await fetch('/api/food-interpret',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q})});
    const d=await r.json();
    if(seq!==fpSeq)return;
    items=(d.items&&d.items.length)?d.items:null;
  }catch(e){/* fall through to a plain search */}
  if(seq!==fpSeq)return;
  if(!items)items=[{name:q,brand:null,qty:1,serving:null,kind:'whole',dbQuery:q}];
  fpInterp=items;

  // 2. Route each interpreted item to the right source.
  //    Restaurant items skip the databases entirely — they aren't in them, and
  //    searching anyway is what produced Domino's for a Jet's query.
  const primary=items[0];
  fpLastDbQuery=primary.dbQuery||q;

  if(primary.kind==='restaurant'){
    fpState='done';renderFoodPicker();
    await escalate(primary,seq);
  }else{
    await dbPage(fpLastDbQuery,seq,false);
    if(seq!==fpSeq)return;
    // Filter out results that clearly aren't the requested brand.
    if(primary.brand)fpRows=fpRows.filter(r=>brandOk(r,primary.brand));
    renderFoodPicker();
    if(!fpRows.length)await escalate(primary,seq);
  }

  // 3. Multi-item input ("two eggs and a tortilla"): resolve the rest too.
  if(items.length>1){
    for(let i=1;i<items.length;i++){
      if(seq!==fpSeq)return;
      await resolveExtra(items[i],seq);
    }
  }
}

// Keep a database result only if it plausibly matches the requested brand.
function brandOk(row,brand){
  const b=String(brand).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2);
  if(!b.length)return true;
  const hay=(String(row.name||'')+' '+String(row.brand||'')).toLowerCase();
  return b.every(w=>hay.includes(w));
}

async function dbPage(q,seq,more){
  const next=(more?fpPage:0)+1;
  try{
    const r=await fetch('/api/food-db?q='+encodeURIComponent(q)+'&page='+next);
    const data=await r.json();
    if(seq!==fpSeq)return;
    if(!r.ok||data.error){fpState='error';fpErr=data.error||('HTTP '+r.status);fpMoreLoading=false;renderFoodPicker();return;}
    const seen=new Set(fpRows.map(x=>x.id));
    (data.items||[]).forEach(x=>{if(!seen.has(x.id)){fpRows.push(x);seen.add(x.id);}});
    fpPage=data.page||next;
    fpHasMore=!!data.hasMore;
    fpState='done';fpMoreLoading=false;
    renderFoodPicker();
  }catch(err){
    if(seq!==fpSeq)return;
    fpState='error';fpErr=String(err&&err.message||err);fpMoreLoading=false;renderFoodPicker();
  }
}

// Additional items from a multi-food query: try the DB, then AI, quietly.
async function resolveExtra(item,seq){
  if(item.kind!=='restaurant'){
    try{
      const r=await fetch('/api/food-db?q='+encodeURIComponent(item.dbQuery||item.name)+'&page=1');
      const d=await r.json();
      if(seq!==fpSeq)return;
      const hit=(d.items||[]).find(x=>!item.brand||brandOk(x,item.brand));
      if(hit&&!fpRows.some(x=>x.id===hit.id)){fpRows.push(hit);renderFoodPicker();return;}
    }catch(e){}
  }
  const ai=await aiLookup(item,'web')||await aiLookup(item,'estimate');
  if(seq!==fpSeq)return;
  if(ai){fpRows.push(ai);renderFoodPicker();}
}

// Tier 2 then tier 3, each its own short request, appending as they land.
async function escalate(item,seq){
  fpAiState='web';renderFoodPicker();
  const web=await aiLookup(item,'web');
  if(seq!==fpSeq)return;
  if(web){fpRows.push(web);fpAiState='done';renderFoodPicker();return;}

  fpAiState='estimate';renderFoodPicker();
  const est=await aiLookup(item,'estimate');
  if(seq!==fpSeq)return;
  if(est)fpRows.push(est);
  fpAiState='done';renderFoodPicker();
}
async function aiLookup(item,mode){
  try{
    const r=await fetch('/api/food-ai',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:item.name,brand:item.brand||'',serving:item.serving||'',mode})});
    const d=await r.json();
    return (r.ok&&d.found&&d.item)?d.item:null;
  }catch(e){return null;}
}

/* ---- detail sheet: servings + meal, then log ---- */
let fpDetail=null, fpServings=1, fpMeal='';
function openFoodDetail(id){

        <button class="pk-close" onclick="closeFoodDetail()">✕</button>

        <div class="profilefield">

          </div>
        </div>
        <div class="ringcard" style="text-align:left;padding:14px 16px">
          <div class="dc-big" id="fd_cal">${Math.round((n.calories||0)*q)}<span style="font-size:15px;color:var(--text2)"> cal</span></div>
          <div class="dc-sub" id="fd_macros">${vis.filter(x=>x.k!=='calories').map(x=>`${Math.round((n[x.k]||0)*q)}${x.unit} ${x.label.toLowerCase()}`).join(' · ')}</div>
        </div>

        ${r.source!=='staple'?`<button class="btn ghost" onclick="logFoodDetail(true)">Add &amp; save to my foods</button>`:''}
      </div>

  const qi=E('fd_qty');
  if(qi)qi.oninput=()=>{

  };
}
function closeFoodDetail(){const m=E('fooddetail');if(m)m.remove();}

async function logFoodDetail(alsoSave){
  const r=fpDetail;if(!r)return;
  const n=r.nutrients||{},q=fpServings||1;
  let foodId=r._stapleId||null;

  if(alsoSave){
    const srow={user_id:user.id,name:r.name,serving:r.serving||'1 serving',
      source:r.source==='staple'?'custom':r.source,
      confidence:confOf(r.source),source_url:r.sourceUrl||null};
    NUTRIENTS.forEach(x=>{srow[x.k]=round1(n[x.k]||0);});
    const {data,error}=await sb.from('foods').insert(srow).select().maybeSingle();
    if(error)toast('⚠ not saved to my foods: '+error.message);
    else if(data)foodId=data.id;
  }

  const row={user_id:user.id,date:foodToday(),food_id:foodId,name:r.name,
    meal_slot:fpMeal||null,qty:q,source:r.source==='staple'?'custom':r.source,
    confidence:confOf(r.source),source_url:r.sourceUrl||null};
  NUTRIENTS.forEach(x=>{row[x.k]=round1((n[x.k]||0)*q);});
  const {error}=await sb.from('food_log').insert(row);
  if(error){toast('⚠ NOT saved: '+error.message);return;}
  toast(`Logged ${r.name}`);
  closeFoodDetail();closeFoodPicker();
  await loadAll();active='food';render();
}
function confOf(src){
  if(src==='usda'||src==='usda_branded'||src==='off')return 'verified';
  if(src==='web')return 'published';
  if(src==='estimate')return 'estimated';
  return 'custom';
}
function round1(v){return Math.round((Number(v)||0)*10)/10;}

function addManualFromQuery(){
  closeFoodPicker();
  openStapleEditor(null,{name:(fpQuery||'').trim(),oneOff:true});
}
async function pickFood(id){
  openFoodDetail('staple-'+id);
}
function oneOffFromQuery(){ addManualFromQuery(); }


/* ---- edit a logged entry (servings / meal) ---- */
let editEntry=null, editQty=1, editMeal='';
function openEditEntry(id){
  const e=(FOODLOG||[]).find(x=>String(x.id)===String(id));
  if(!e)return;
  editEntry=e;
  editQty=Number(e.qty)||1;
  editMeal=e.meal_slot||'';
  renderEditEntry();
}
function renderEditEntry(){
  let m=E('editentry');
  if(!m){m=document.createElement('div');m.id='editentry';m.className='modal';document.body.appendChild(m);}
  const e=editEntry;
  const baseQty=Number(e.qty)||1;
  const vis=visibleNutrients();
  // Stored values are already scaled by the original qty — derive per-serving.
  const per={};NUTRIENTS.forEach(n=>{per[n.k]=(Number(e[n.k])||0)/(baseQty||1);});
  const q=editQty||0;
  m.innerHTML=`<div class="modal-bg" onclick="closeEditEntry()"></div>
    <div class="modal-card">
      <div class="pk-head">
        <b style="font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.5px;flex:1">${escHtml(e.name)}</b>
        <button class="pk-close" onclick="closeEditEntry()">✕</button>
      </div>
      <div class="pk-list">
        ${e.confidence?`<div class="fd-badge"><span class="conf ${confClass(e.confidence)}">${confLabel(e.confidence)}</span>${e.source_url?` <a class="fd-src" href="${escAttr(e.source_url)}" target="_blank" rel="noopener">View source ↗</a>`:''}</div>`:''}
        <div class="profilefield">
          <label>Servings</label>
          <input type="number" inputmode="decimal" step="0.25" id="ee_qty" value="${q}" style="font-size:20px">
        </div>
        <div class="profilefield">
          <label>Meal</label>
          <div class="mealpick">
            ${['Breakfast','Lunch','Dinner','Snack'].map(s=>
              `<button class="mp ${editMeal===s?'on':''}" onclick="editMeal=(editMeal==='${s}'?'':'${s}');renderEditEntry()">${s}</button>`).join('')}
          </div>
        </div>
        <div class="ringcard" style="text-align:left;padding:14px 16px">
          <div class="dc-big" id="ee_cal">${Math.round(per.calories*q)}<span style="font-size:15px;color:var(--text2)"> cal</span></div>
          <div class="dc-sub" id="ee_macros">${vis.filter(x=>x.k!=='calories').map(x=>`${Math.round(per[x.k]*q)}${x.unit} ${x.label.toLowerCase()}`).join(' · ')}</div>
        </div>
        <button class="btn" onclick="saveEditEntry()">Save changes</button>
        <button class="btn ghost" style="color:var(--warn);border-color:var(--warn)" onclick="deleteEditEntry()">Delete entry</button>
      </div>
    </div>`;
  const qi=E('ee_qty');
  if(qi)qi.oninput=()=>{
    editQty=Number(qi.value)||0;
    E('ee_cal').innerHTML=`${Math.round(per.calories*editQty)}<span style="font-size:15px;color:var(--text2)"> cal</span>`;
    E('ee_macros').textContent=vis.filter(x=>x.k!=='calories').map(x=>`${Math.round(per[x.k]*editQty)}${x.unit} ${x.label.toLowerCase()}`).join(' · ');
  };
}
function closeEditEntry(){const m=E('editentry');if(m)m.remove();}
async function saveEditEntry(){
  const e=editEntry;if(!e)return;
  const baseQty=Number(e.qty)||1;
  const upd={qty:editQty,meal_slot:editMeal||null};
  NUTRIENTS.forEach(n=>{
    const perServing=(Number(e[n.k])||0)/(baseQty||1);
    upd[n.k]=Math.round(perServing*editQty*10)/10;
  });
  const {error}=await sb.from('food_log').update(upd).eq('id',e.id);
  if(error){toast('⚠ '+error.message);return;}
  toast('Updated');
  closeEditEntry();await loadAll();active='food';render();
}
async function deleteEditEntry(){
  const e=editEntry;if(!e)return;
  if(!confirm(`Delete ${e.name}?`))return;
  closeEditEntry();await delFoodLog(e.id);
}
function confClass(c){
  return c==='verified'?'conf-verified':c==='published'?'conf-published':c==='estimated'?'conf-estimated':'conf-staple';
}
function confLabel(c){
  return c==='verified'?'Verified':c==='published'?'Brand site':c==='estimated'?'~ Estimate':'Custom';
}

/* ---- copy a previous day's food ---- */
let copyDate='', copyPicked=new Set();
function openCopyDay(){
  const y=new Date();y.setDate(y.getDate()-1);
  copyDate=localDate(y);copyPicked=new Set();
  renderCopyDay();
}
function renderCopyDay(){
  let m=E('copyday');
  if(!m){m=document.createElement('div');m.id='copyday';m.className='modal';document.body.appendChild(m);}
  const rows=(FOODLOG||[]).filter(e=>e.date===copyDate);
  m.innerHTML=`<div class="modal-bg" onclick="closeCopyDay()"></div>
    <div class="modal-card">
      <div class="pk-head">
        <b style="font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.5px;flex:1">Copy food</b>
        <button class="pk-close" onclick="closeCopyDay()">✕</button>
      </div>
      <div class="pk-list">
        <div class="fooddatenav" style="margin-top:0">
          <button class="ord" onclick="shiftCopyDate(-1)">←</button>
          <input type="date" value="${copyDate}" onchange="copyDate=this.value;copyPicked=new Set();renderCopyDay()">
          <button class="ord" onclick="shiftCopyDate(1)">→</button>
        </div>
        ${rows.length?`
          <button class="btn ghost" style="margin-bottom:10px" onclick="toggleAllCopy()">${copyPicked.size===rows.length?'Clear all':'Select all'}</button>
          ${rows.map(e=>`<button class="foodrow ${copyPicked.has(String(e.id))?'picked':''}" onclick="toggleCopy('${e.id}')">
            <div class="fr-top"><span class="fr-name">${escHtml(e.name)}${e.qty&&Number(e.qty)!==1?` ×${e.qty}`:''}</span>
              <span class="copytick">${copyPicked.has(String(e.id))?'✓':''}</span></div>
            <div class="fr-macros">${Math.round(Number(e.calories)||0)} cal${e.meal_slot?` · ${escHtml(e.meal_slot)}`:''}</div>
          </button>`).join('')}
          <button class="btn" style="margin-top:12px" onclick="doCopyDay()">Copy ${copyPicked.size||''} to ${foodToday()===today()?'today':fmtDate(foodToday())}</button>
        `:`<div class="pk-empty">Nothing logged on ${fmtDate(copyDate)}.</div>`}
      </div>
    </div>`;
}
function closeCopyDay(){const m=E('copyday');if(m)m.remove();}
function shiftCopyDate(n){
  const d=new Date(copyDate+'T12:00');d.setDate(d.getDate()+n);
  copyDate=localDate(d);copyPicked=new Set();renderCopyDay();
}
function toggleCopy(id){
  const k=String(id);
  if(copyPicked.has(k))copyPicked.delete(k);else copyPicked.add(k);
  renderCopyDay();
}
function toggleAllCopy(){
  const rows=(FOODLOG||[]).filter(e=>e.date===copyDate);
  if(copyPicked.size===rows.length)copyPicked=new Set();
  else copyPicked=new Set(rows.map(e=>String(e.id)));
  renderCopyDay();
}
async function doCopyDay(){
  const rows=(FOODLOG||[]).filter(e=>copyPicked.has(String(e.id)));
  if(!rows.length){toast('Nothing selected');return;}
  const target=foodToday();
  const payload=rows.map(e=>{
    const r={user_id:user.id,date:target,food_id:e.food_id||null,name:e.name,
      meal_slot:e.meal_slot||null,qty:e.qty||1,source:e.source||'custom',
      confidence:e.confidence||null,source_url:e.source_url||null};
    NUTRIENTS.forEach(n=>{r[n.k]=e[n.k]!=null?e[n.k]:null;});
    return r;
  });
  const {error}=await sb.from('food_log').insert(payload);
  if(error){toast('⚠ '+error.message);return;}
  toast(`Copied ${payload.length} item${payload.length===1?'':'s'}`);
  closeCopyDay();await loadAll();active='food';render();
}

/* --- staple editor (define/edit a food) --- */
let editingStapleId=null, stapleOneOff=false;
function openStapleEditor(id,opts){
  editingStapleId=id||null;
  stapleOneOff=!!(opts&&opts.oneOff);
  const f=id?FOODS.find(x=>x.id===id):(opts||{});
  renderStapleEditor(f||{});
}
function editStaple(id){openStapleEditor(id);}
function renderStapleEditor(f){
  let m=E('stapleeditor');
  if(!m){m=document.createElement('div');m.id='stapleeditor';m.className='modal';document.body.appendChild(m);}
  const vis=visibleNutrients();
  const title=stapleOneOff?'Log one-off food':(editingStapleId?'Edit staple':'Define a staple');
  let fields=vis.map(n=>`
    <div class="nutfield">
      <label for="sf_${n.k}">${n.label}${n.unit?` <span class="nu">(${n.unit})</span>`:''}</label>
      <input type="number" inputmode="decimal" id="sf_${n.k}" value="${f[n.k]!=null?f[n.k]:''}" placeholder="—">
    </div>`).join('');
  m.innerHTML=`<div class="modal-bg" onclick="closeStapleEditor()"></div>
    <div class="modal-card">
      <div class="pk-head"><b style="font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.5px">${title}</b>
        <button class="pk-close" onclick="closeStapleEditor()">✕</button></div>
      <div class="pk-list">
        <div class="profilefield"><label>Name</label><input type="text" id="sf_name" value="${(f.name||'').replace(/"/g,'&quot;')}" placeholder="e.g. PB sandwich"></div>
        <div class="profilefield"><label>Serving (optional)</label><input type="text" id="sf_serving" value="${(f.serving||'').replace(/"/g,'&quot;')}" placeholder="e.g. 2 slices + 2 tbsp PB"></div>
        <div class="nutgrid">${fields}</div>
        <div class="daymeta" style="text-transform:none;letter-spacing:0;margin-top:6px">Values per serving. Add optional nutrients from Profile → nutrient options.</div>
        ${stapleOneOff
          ? `<button class="btn" onclick="saveOneOff()">Log it</button>`
          : `<button class="btn" onclick="saveStaple()">${editingStapleId?'Save changes':'Save staple'}</button>`}
        ${editingStapleId&&!stapleOneOff?`<button class="btn ghost" onclick="archiveStaple()">Delete this staple</button>`:''}
      </div>
    </div>`;
  E('sf_name').focus();
}
function closeStapleEditor(){const m=E('stapleeditor');if(m)m.remove();}
function readStapleForm(){
  const row={name:E('sf_name').value.trim(),serving:E('sf_serving').value.trim()||null};
  visibleNutrients().forEach(n=>{const v=E('sf_'+n.k).value;row[n.k]=v!==''?Number(v):null;});
  return row;
}
async function saveStaple(){
  const row=readStapleForm();
  if(!row.name){toast('Name it first');return}
  try{
    if(editingStapleId){
      const {error}=await sb.from('foods').update(row).eq('id',editingStapleId);if(error)throw error;
    }else{
      const {error}=await sb.from('foods').insert({user_id:user.id,is_meal:true,source:'custom',...row});if(error)throw error;
    }
    closeStapleEditor();toast('Staple saved ✓');await loadAll();active='food';render();
  }catch(e){toast('⚠ NOT saved: '+(e.message||e));}
}
async function saveOneOff(){
  const row=readStapleForm();
  if(!row.name){toast('Name it first');return}
  // log directly without saving as a staple
  const food={...row,id:null,source:'custom'};
  closeStapleEditor();
  await addFoodLog(food,1,null);
}
async function archiveStaple(){
  if(!editingStapleId)return;
  if(!confirm('Delete this staple? Past logged entries are kept.'))return;
  const {error}=await sb.from('foods').update({archived:true}).eq('id',editingStapleId);
  if(error){toast('⚠ '+error.message);return}
  closeStapleEditor();toast('Deleted');await loadAll();active='food';render();
}

/* ============ DATA (import/export) ============ */
function dataView(){
  const sessions=SESS.a.length+SESS.b.length+SESS.c.length;
  let h=`<div class="daytitle">Data</div><div class="daymeta">Signed in as ${user.email}</div>`;
  h+=`<div class="statrow">
    <div class="stat"><div class="lab">Lift sessions</div><div class="val">${sessions}</div></div>
    <div class="stat"><div class="lab">Walks</div><div class="val">${WALKS.length}</div></div>
    <div class="stat"><div class="lab">Weigh-ins</div><div class="val">${WEIGHTS.length}</div></div>
  </div>`;
  h+=`<div class="histhead" style="margin-top:10px">Import from artifact</div>
  <div class="empty" style="padding:8px 0">Paste the export from the Claude artifact version below. Adds everything to your database (safe to run once; running twice duplicates entries).</div>
  <textarea id="importbox" rows="4" placeholder="Paste artifact export here…"></textarea>
  <button class="btn ghost" onclick="importArtifact()">Import artifact history</button>`;
  h+=`<div class="histhead" style="margin-top:22px">Export</div>
  <div class="empty" style="padding:8px 0">Your data lives in your Supabase database now, but a copy never hurts.</div>
  <button class="btn ghost" onclick="exportAll()">Export everything to text</button>
  <textarea id="exportbox" rows="5" readonly onclick="this.select()" placeholder="Export appears here…"></textarea>`;
  h+=`<button class="btn ghost" style="margin-top:26px" onclick="signOut()">Sign out</button>`;
  return h;
}
async function importArtifact(){
  const t=E('importbox').value.trim();
  if(!t){toast('Paste the artifact export first');return}
  let obj;
  try{obj=JSON.parse(t)}catch(e){toast('⚠ Invalid data');return}
  if(!obj.workouts&&!obj.walks&&!obj.weights&&!obj.foods){toast('⚠ Not a recognized import');return}
  try{
    let n=0;
    // Foods (staples) import
    let foodCount=0;
    if(Array.isArray(obj.foods)&&obj.foods.length){
      const frows=obj.foods.map(f=>({
        user_id:user.id, name:f.name, serving:f.serving||null, is_meal:true, source:'custom',
        calories:f.calories!=null?Number(f.calories):null,
        protein:f.protein!=null?Number(f.protein):null,
        carbs:f.carbs!=null?Number(f.carbs):null,
        fat:f.fat!=null?Number(f.fat):null,
        fiber:f.fiber!=null?Number(f.fiber):null,
        sodium:f.sodium!=null?Number(f.sodium):null,
        added_sugar:f.added_sugar!=null?Number(f.added_sugar):null,
        sat_fat:f.sat_fat!=null?Number(f.sat_fat):null,
        cholesterol:f.cholesterol!=null?Number(f.cholesterol):null,
        potassium:f.potassium!=null?Number(f.potassium):null
      }));
      const {error}=await sb.from('foods').insert(frows);
      if(error)throw error;
      foodCount=frows.length;
    }
    for(const day of ['a','b','c']){
      for(const s of (obj.workouts?.[day]||[])){
        const {data:sess,error:e1}=await sb.from('sessions').insert({user_id:user.id,day,date:s.date,note:s.note||null}).select();
        if(e1)throw e1;
        const rows=(s.lifts||[]).map(l=>({
          user_id:user.id,session_id:sess[0].id,date:s.date,day,name:l.name,
          weight:l.weight?Number(l.weight):null,
          s1:l.sets?.[0]?Number(l.sets[0]):null,s2:l.sets?.[1]?Number(l.sets[1]):null,s3:l.sets?.[2]?Number(l.sets[2]):null
        }));
        if(rows.length){const {error:e2}=await sb.from('lifts').insert(rows);if(e2)throw e2}
        n++;
      }
    }
    const walks=(obj.walks||[]).map(w=>({user_id:user.id,date:w.date,mins:Number(w.mins)||0,type:w.type||null,dist:w.dist?Number(w.dist):null,cal:w.cal?Number(w.cal):null,note:w.note||null}));
    if(walks.length){const {error}=await sb.from('walks').insert(walks);if(error)throw error}
    const weights=(obj.weights||[]).map(w=>({user_id:user.id,date:w.date,lbs:Number(w.lbs),waist:w.waist||null,arm:w.arm||null,bf:w.bf||null,bp:w.bp||null}));
    if(weights.length){const {error}=await sb.from('weights').insert(weights)&&{};if(error)throw error}
    const parts=[];
    if(n)parts.push(`${n} sessions`);
    if(walks.length)parts.push(`${walks.length} walks`);
    if(weights.length)parts.push(`${weights.length} weigh-ins`);
    if(foodCount)parts.push(`${foodCount} staples`);
    toast(`Imported ✓ ${parts.join(', ')||'nothing'}`);
    await loadAll();active=foodCount&&!n?'food':'data';render();
  }catch(err){toast('⚠ Import failed: '+(err.message||err))}
}
function exportAll(){
  E('exportbox').value=JSON.stringify({sessions:SESS,walks:WALKS,weights:WEIGHTS,exercises:EX});
  toast('Exported — tap the box to select');
}

boot();
</script>
