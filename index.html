<!DOCTYPE html>
<!-- saved from url=(0040)https://tracker-fitness-app.netlify.app/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F5F7">
<title>Forge — Modern Hobbit</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
/* ============================================================
   MODERN HOBBIT — DESIGN SYSTEM v2 (applied)
   StrongLifts energy · bold red · dark+light · legible
   ============================================================ */
:root{
  --font-display:'Barlow Condensed',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-data:'JetBrains Mono',ui-monospace,monospace;
  --t-hero:52px;--t-title:30px;--t-card:20px;--t-body:17px;--t-small:15px;--t-label:12px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r-card:16px;--r-input:10px;--r-pill:999px;
}
/* LIGHT (default) */
html,html.theme-light{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#EDEDF0; --line:#DCDCE2;
  --text:#16161A; --text2:#4A4A53; --text3:#6E6E78;
  --accent:#FF3B30; --accent-ink:#FFFFFF; --good:#248A3D; --warn:#C93400; --track:#E2E2E8;
  /* legacy aliases so existing markup keeps working */
  --ink:var(--bg); --parchment:var(--text); --muted:var(--text2); --brass:var(--accent); --rust:var(--warn);
}
html.theme-dark{
  --bg:#0E0E10; --surface:#1A1A1E; --surface2:#26262C; --line:#34343C;
  --text:#F5F5F7; --text2:#B8B8C2; --text3:#86868F;
  --accent:#FF3B30; --accent-ink:#FFFFFF; --good:#35C759; --warn:#FF9F0A; --track:#2A2A31;
  --ink:var(--bg); --parchment:var(--text); --muted:var(--text2); --brass:var(--accent); --rust:var(--warn);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--t-body);min-height:100vh;padding-bottom:110px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ---- top bar ---- */
header{padding:20px 0 14px;display:flex;align-items:center;justify-content:space-between}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.5px;text-transform:uppercase}
.brand h1 .dot{color:var(--accent)}
.brand h1 small{font-family:var(--font-data);font-size:11px;color:var(--text3);font-weight:500;-webkit-text-size-adjust:none}
.mh{font-family:var(--font-data);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase}
.themebtn{background:var(--surface);border:1px solid var(--line);color:var(--text2);border-radius:var(--r-pill);width:40px;height:40px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ---- screen titles ---- */
.daytitle{font-family:var(--font-display);font-size:var(--t-title);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 2px}
.daymeta{font-family:var(--font-body);font-size:14px;color:var(--text2);font-weight:500}
.warn{margin:12px 0;padding:10px 13px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn);font-size:14px;border-radius:0 8px 8px 0;line-height:1.5}

/* ---- exercise rows ---- */
.exrow{border-bottom:1px solid var(--line);padding:14px 0}
.exname{font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fields{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.field{flex:1;min-width:0}
.field label{display:block;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text2);margin-bottom:5px}
input,textarea,select{width:100%;background:var(--surface2);border:1.5px solid var(--line);color:var(--text);font-family:var(--font-data);font-size:17px;padding:12px 11px;border-radius:var(--r-input)}
input::placeholder,textarea::placeholder{color:var(--text3)}
input.wt{border-color:var(--accent)}
.last{font-family:var(--font-data);font-size:13px;color:var(--accent);white-space:nowrap;font-weight:700}
.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---- buttons ---- */
.btn{display:block;width:100%;margin:18px 0 8px;padding:16px;border:none;border-radius:var(--r-input);background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface2);border:1px solid var(--line);color:var(--text);font-family:var(--font-body);font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;padding:13px}

/* ---- toast ---- */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-family:var(--font-body);font-weight:600;font-size:14px;padding:11px 18px;border-radius:var(--r-pill);opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.btn:active{transform:none}}

/* ---- history / ledger ---- */
.hist{margin-top:24px}
.histhead{font-family:var(--font-display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:6px;display:inline-block}
.entry{border-bottom:1px solid var(--line);padding:13px 0}
.entrytop{display:flex;justify-content:space-between;align-items:center}
.entrydate{font-family:var(--font-data);font-size:14px;color:var(--accent);font-weight:700}
.entrybody{font-family:var(--font-body);font-size:14px;color:var(--text2);margin-top:6px;line-height:1.7;font-weight:500}
.entrybody b{color:var(--text);font-weight:700}
.del{background:none;border:none;color:var(--text3);font-family:var(--font-body);font-size:13px;cursor:pointer;padding:4px}
.del:hover{color:var(--warn)}
.rmx{background:none;border:1px solid var(--warn);color:var(--warn);border-radius:6px;font-size:13px;padding:3px 9px;cursor:pointer;font-family:var(--font-body);font-weight:600}
.rowctl{display:flex;align-items:center;gap:6px}
.ord{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;font-size:15px;line-height:1;padding:5px 9px;cursor:pointer}
.ord:disabled{opacity:.3;cursor:default}
.swapbtn{background:none;border:1px solid var(--line);color:var(--text2);border-radius:6px;font-size:14px;padding:3px 9px;cursor:pointer}
.swapbtn:hover{border-color:var(--accent);color:var(--accent)}
.swaptag{font-family:var(--font-data);font-size:9px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px;margin-left:4px;text-transform:uppercase;letter-spacing:1px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}
.addrow button{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:0 16px;border-radius:var(--r-input);cursor:pointer;font-size:20px}

/* ---- stats / big numbers ---- */
.bignum{font-family:var(--font-data);font-size:44px;font-weight:700;letter-spacing:-1px}
.bignum small{font-size:14px;color:var(--text2);font-weight:500}
.delta{font-family:var(--font-data);font-size:14px;font-weight:700}
.delta.down{color:var(--good)}
.delta.up{color:var(--warn)}
.statrow{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.stat{flex:1 1 40%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .lab{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text2)}
.stat .val{font-family:var(--font-data);font-size:22px;font-weight:700;margin-top:4px}
.empty{color:var(--text2);font-size:15px;padding:16px 0;font-style:italic}
.notesfield{margin-top:14px}
#loading{padding:60px 0;text-align:center;color:var(--text3);font-family:var(--font-display);font-size:16px;letter-spacing:1px;text-transform:uppercase}
.authbox{margin-top:50px}
.authbox .field{margin-bottom:14px}
.authnote{font-size:14px;color:var(--text2);margin-top:12px;line-height:1.6}
.protocol{margin:12px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.protocol .rows{font-family:var(--font-data);font-size:13px;line-height:1.8}
.protocol b{color:var(--accent)}
.setupwarn{margin:40px 0;padding:18px;border:1px solid var(--warn);border-radius:12px;color:var(--warn);font-size:15px;line-height:1.6}

/* ---- stretch/warmup/editcfg (kept) ---- */
.stretchrow{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:15px;color:var(--text2);cursor:pointer}
.stretchrow input{width:auto;flex:0}
.fields.warmup{margin-top:6px;opacity:.9}
.fields.warmup input{border-style:dashed}
.fields.editcfg{margin-top:6px}
.fields.editcfg select{width:100%}

/* ---- charts ---- */
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin:14px 0}
.chartcard h3{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.chartcard .sub{font-family:var(--font-body);font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:500}
.chartcard svg{width:100%;height:auto;display:block}
.chartpick{width:100%;margin-bottom:6px}
.recomp{margin:14px 0;padding:14px 16px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:15px;line-height:1.6}
.recomp b{color:var(--accent)}
.profilefield{margin-bottom:16px}
.profilefield label{display:block;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}

/* ---- modal / picker ---- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column}
.pk-head{display:flex;gap:8px;padding:16px;border-bottom:1px solid var(--line);align-items:center}
.pk-head input{flex:1}
.pk-close{background:var(--surface2);border:1px solid var(--line);color:var(--text2);border-radius:var(--r-input);padding:0 16px;cursor:pointer;font-size:16px;height:44px}
.pk-list{overflow-y:auto;padding:10px 16px 24px}
.pk-cat{font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
.pk-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:var(--r-input);margin-bottom:6px;cursor:pointer;font-size:16px;font-weight:500}
.pk-item:hover:not(:disabled){border-color:var(--accent)}
.pk-item.on{opacity:.45;cursor:default}
.pk-item.custom{background:transparent;border-color:var(--accent);color:var(--accent);font-weight:600}
.pk-inc{font-family:var(--font-data);font-size:12px;color:var(--text2)}
.pk-tag{font-family:var(--font-data);font-size:10px;color:var(--text2);text-transform:uppercase}
.pk-empty{color:var(--text2);font-style:italic;padding:20px 0;text-align:center;font-size:15px}

/* ---- food ---- */
.fooddatenav{display:flex;align-items:center;gap:8px;margin:14px 0}
.fooddatenav input{flex:1;text-align:center}
.foodtotals{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.fttile{flex:1 1 30%;min-width:92px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ftlab{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--text2)}
.ftval{font-family:var(--font-data);font-size:20px;font-weight:700;margin-top:3px}
.fttgt{font-size:12px;color:var(--text2);font-weight:400}
.ftavg{font-family:var(--font-data);font-size:11px;color:var(--text2);margin-top:3px}
.ftbar{height:5px;background:var(--track);border-radius:3px;margin-top:7px;overflow:hidden}
.ftfill{height:100%;background:var(--accent);border-radius:3px}
.ftfill.over{background:var(--warn)}
.nutopts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.nutopt{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--text2);cursor:pointer;flex:1 1 40%}
.nutopt input{width:auto;flex:0}

/* ---- macro rings (new) ---- */
.ringcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 16px;margin:14px 0;text-align:center}
.hero-ring{margin-bottom:20px}
.hero-ring .ring{position:relative;display:inline-block}
.hero-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-ring .num{font-family:var(--font-data);font-size:44px;font-weight:700;line-height:1}
.hero-ring .of{font-family:var(--font-body);font-size:14px;color:var(--text2);font-weight:600;margin-top:3px}
.hero-left{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-top:12px}
.macrorings{display:flex;gap:12px;justify-content:space-between}
.mring{text-align:center;flex:1}
.mring .ring{position:relative;display:inline-block}
.mring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mring .num{font-family:var(--font-data);font-size:22px;font-weight:700}
.mring .of{font-family:var(--font-body);font-size:11px;color:var(--text2)}
.mring .lab{font-family:var(--font-body);font-size:13px;font-weight:600;margin-top:8px}
.mring .left{font-family:var(--font-body);font-size:12px;color:var(--text2);margin-top:2px}

/* ---- dashboard cards ---- */
.dashcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;margin-bottom:14px}
.dashcard .dc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dashcard .dc-title{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dashcard .dc-link{font-family:var(--font-body);font-size:14px;color:var(--accent);font-weight:600;cursor:pointer}
.dashcard .dc-big{font-family:var(--font-data);font-size:34px;font-weight:700;letter-spacing:-1px}
.dashcard .dc-sub{font-family:var(--font-body);font-size:14px;color:var(--text2);margin-top:2px;font-weight:500}

/* ---- bottom nav ---- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 0 22px;z-index:40}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text3);font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:1;background:none;border:none;cursor:pointer;padding:4px 0}
.navitem.active{color:var(--accent)}
.navitem svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.navadd{width:56px;height:56px;border-radius:var(--r-pill);background:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 20px rgba(255,59,48,.4);border:none;cursor:pointer}
.navadd svg{width:28px;height:28px;stroke:var(--accent-ink);stroke-width:2.5;fill:none}

/* ---- log sheet (which day/thing to log) ---- */
.logsheet-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:var(--r-input);margin-bottom:8px;cursor:pointer;font-size:17px;font-weight:600}
.logsheet-item:hover{border-color:var(--accent)}
.logsheet-item .ls-ico{font-size:22px}

/* set circles */
.setblock{margin-top:12px}
.setweight{position:relative;display:flex;align-items:center;margin-bottom:12px;max-width:180px}
.setweight label{position:absolute;top:-8px;left:10px;background:var(--surface);padding:0 5px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--text2)}
.setweight input.wt{padding-right:44px}
.setweight-unit{position:absolute;right:12px;font-family:var(--font-data);font-size:14px;color:var(--text2);pointer-events:none}
.setcircles{display:flex;gap:12px}
.setc{width:56px;height:56px;border-radius:var(--r-pill);border:2px solid var(--line);background:transparent;
  color:var(--text3);font-family:var(--font-data);font-size:19px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.setc:active{transform:scale(.92)}
.setc .setc-target{opacity:.4}
.setc.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setc.partial{background:var(--warn);border-color:var(--warn);color:#1a1400}
.setc.zero{border-color:var(--accent);color:var(--accent)}
/* number pad */
.scpad-card{padding:22px 20px 20px;text-align:center}
.scpad-head{margin-bottom:16px}
.scpad-ex{font-family:var(--font-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.scpad-sub{font-family:var(--font-body);font-size:14px;color:var(--text2);margin-top:2px}
.scpad-stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:18px}
.scpad-step{width:56px;height:56px;border-radius:var(--r-pill);border:2px solid var(--line);background:var(--surface2);color:var(--text);font-size:30px;font-family:var(--font-data);cursor:pointer;display:flex;align-items:center;justify-content:center}
.scpad-step:active{transform:scale(.92)}
.scpad-val{font-family:var(--font-data);font-size:48px;font-weight:700;min-width:80px}
.scpad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.scpad-key{padding:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font-family:var(--font-data);font-size:18px;font-weight:700;cursor:pointer}
.scpad-key:active{transform:scale(.94)}
.scpad-key.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* brand wordmark image */
.wordmark{height:44px;width:auto;display:block}
.ver{font-family:var(--font-data);font-size:9px;color:var(--text3);letter-spacing:1px}
html.theme-light .wm-dark{display:none}
html.theme-dark .wm-light{display:none}

/* pill tabs (food picker: staples vs search) */
.pill-tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:var(--r-pill);width:fit-content}
.pt{font-family:var(--font-body);font-size:14px;font-weight:600;padding:7px 16px;border-radius:var(--r-pill);color:var(--text2);cursor:pointer;user-select:none}
.pt.on{background:var(--accent);color:var(--accent-ink)}

/* demo mode */
.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--accent);
  color:var(--text);border-radius:12px;padding:10px 14px;margin:14px 0 4px;font-size:14px}
.demobar b{color:var(--accent)}
.demobar-acts{display:flex;gap:8px}
.demobar-acts button{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-pill);
  font-family:var(--font-body);font-weight:600;font-size:13px;padding:6px 14px;cursor:pointer}
.demobar-acts button:last-child{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.authdivider{display:flex;align-items:center;gap:12px;margin:18px 0 10px;color:var(--text3);font-size:13px}
.authdivider:before,.authdivider:after{content:'';flex:1;height:1px;background:var(--line)}
.btn.ghost.demo-btn{border:1.5px solid var(--accent);color:var(--accent);font-weight:700;background:transparent}

/* bodyweight badge in place of the weight field */
.setweight.bw{max-width:none;width:auto}
.bwbadge{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:1px;
  background:var(--surface2);border:1.5px solid var(--line);color:var(--text2);
  border-radius:var(--r-input);padding:11px 18px}

/* rest timer bar (sits just above the bottom nav) */
.restbar{position:fixed;left:0;right:0;bottom:86px;z-index:45;
  background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  overflow:hidden}
.restbar .rb-fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 18%,transparent);
  transition:width 1s linear}
.restbar .rb-inner{position:relative;display:flex;align-items:center;gap:12px;
  max-width:520px;margin:0 auto;padding:10px 16px}
.restbar .rb-label{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--text2);flex:1}
.restbar .rb-time{font-family:var(--font-data);font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.restbar .rb-acts{display:flex;gap:6px}
.restbar .rb-acts button{background:var(--surface2);border:1px solid var(--line);color:var(--text2);
  border-radius:var(--r-pill);font-family:var(--font-body);font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer}
.restbar.done{background:var(--accent);border-color:var(--accent)}
.restbar.done .rb-fill{background:transparent}
.restbar.done .rb-label,.restbar.done .rb-time{color:var(--accent-ink)}
.restbar.done .rb-acts button{background:transparent;border-color:var(--accent-ink);color:var(--accent-ink)}
.pk-more{margin-top:14px}

/* skip */
.skipbtn{background:none;border:1px solid var(--line);color:var(--text3);border-radius:6px;
  font-family:var(--font-body);font-size:12px;font-weight:600;padding:3px 9px;cursor:pointer}
.skipbtn:hover{border-color:var(--text2);color:var(--text2)}
.skipbtn.on{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.exrow.skipped{opacity:.5}
.exrow.skipped .setcircles,.exrow.skipped .setweight,.exrow.skipped .fields.warmup{pointer-events:none;filter:grayscale(1)}
.skiptag{font-family:var(--font-data);font-size:10px;color:var(--warn);border:1px solid var(--warn);
  border-radius:4px;padding:1px 5px;text-transform:uppercase;letter-spacing:1px}

/* smart food cards */
.smartcard{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-input);
  padding:14px;margin-bottom:8px}
.smartcard.est{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.smartcard.missing{opacity:.65}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sc-name{font-weight:700;font-size:16px;flex:1}
.sc-sub{font-family:var(--font-body);font-size:13px;color:var(--text2);margin-top:3px}
.sc-macros{font-family:var(--font-data);font-size:14px;color:var(--text);margin-top:8px;font-weight:500}
.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.sc-src{font-family:var(--font-body);font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
.sc-src.plain{color:var(--text3);font-weight:500}
.sc-log{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-pill);
  font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.5px;
  padding:7px 18px;cursor:pointer}
.conf{font-family:var(--font-body);font-size:11px;font-weight:700;border-radius:var(--r-pill);
  padding:3px 9px;white-space:nowrap}
.conf-verified{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.conf-published{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.conf-estimated{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.escalate{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.esc-head{font-family:var(--font-body);font-size:14px;color:var(--text2);margin-bottom:10px;font-weight:600}

/* food rows — flat list, source label per row */
.foodrow{display:block;width:100%;text-align:left;background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r-input);padding:13px 14px;margin-bottom:7px;cursor:pointer}
.foodrow:hover{border-color:var(--accent)}
.foodrow.est{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent)}
.foodrow.web{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.fr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fr-name{font-weight:600;font-size:16px;color:var(--text);flex:1;line-height:1.3}
.fr-macros{font-family:var(--font-data);font-size:13px;color:var(--text2);margin-top:6px}
.fr-per{opacity:.7}
.fp-status{font-family:var(--font-body);font-size:14px;color:var(--text2);
  padding:12px 2px;display:flex;align-items:center;gap:8px}
.fp-status:before{content:'';width:14px;height:14px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:fpspin .8s linear infinite}
@keyframes fpspin{to{transform:rotate(360deg)}}
.fp-count{font-family:var(--font-data);font-size:12px;color:var(--text3);text-align:center;margin-top:6px}
.conf-off{background:color-mix(in srgb,var(--text2) 16%,transparent);color:var(--text2)}
.conf-staple{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
/* detail sheet */
.fd-badge{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.fd-src{font-family:var(--font-body);font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.fd-src.plain{color:var(--text3);font-weight:500}
.mealpick{display:flex;gap:6px;flex-wrap:wrap}
.mp{flex:1 1 auto;background:var(--surface2);border:1px solid var(--line);color:var(--text2);
  border-radius:var(--r-pill);font-family:var(--font-body);font-size:14px;font-weight:600;
  padding:9px 12px;cursor:pointer}
.mp.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* diary: meal sections */
.fdactions{display:flex;gap:8px;margin:18px 0 8px}
.fdactions .btn{margin:0}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:18px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.mealhead>span:first-child{font-family:var(--font-display);font-size:17px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.mh-right{display:flex;align-items:center;gap:10px}
.mh-cal{font-family:var(--font-data);font-size:13px;color:var(--text2)}
.mh-add{background:var(--surface2);border:1px solid var(--line);color:var(--accent);
  border-radius:var(--r-pill);width:28px;height:28px;font-size:17px;line-height:1;cursor:pointer}
.entry-tap{cursor:pointer}
.entry-tap:hover .entryedit{color:var(--accent)}
.entryedit{font-family:var(--font-body);font-size:13px;color:var(--text3);font-weight:600}
.foodrow.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.copytick{font-family:var(--font-data);font-size:16px;color:var(--accent);font-weight:700;min-width:14px}

/* warm-up row */
.warmblock{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.setweight.warm{max-width:150px;margin-bottom:0}
.setweight.warm input.wt{border-color:var(--line);border-style:dashed}
.setcircles.warm{align-items:center;gap:10px}
.setc.warm{width:46px;height:46px;font-size:16px;border-style:dashed}
.setc.warm.done{background:var(--text3);border-color:var(--text3);color:var(--bg);border-style:solid}
.warmnote{font-family:var(--font-body);font-size:12px;color:var(--text3)}

/* calculator */
.calcopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-input);padding:11px 13px;margin-bottom:6px;cursor:pointer;text-align:left}
.calcopt b{font-size:15px;font-weight:600}
.calcopt span{font-size:12px;color:var(--text2)}
.calcopt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.calcopt.on b{color:var(--accent)}
.calcwarn{margin-top:10px;font-size:13px;color:var(--warn);line-height:1.5}
.calcnote{font-size:13px;color:var(--text2);line-height:1.6;margin:12px 0}

/* staple editor: nutrients in a readable grid, not a squeezed flex row */
.nutgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px;margin-top:6px}
.nutfield{display:flex;flex-direction:column;min-width:0}
.nutfield label{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--text);
  margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nutfield .nu{font-weight:400;color:var(--text2)}
.nutfield input{width:100%;font-size:17px;padding:12px 11px}
@media (min-width:520px){.nutgrid{grid-template-columns:repeat(3,1fr)}}

/* history rows + remaining line */
.foodrow.hist{background:var(--surface);border-color:var(--line)}
.foodrow.hist:active{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:var(--accent)}
.fp-hint{font-family:var(--font-body);font-size:12px;color:var(--text3);text-align:center;padding:14px 0 4px}
.remaining{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:12px 14px;margin:14px 0 4px;font-family:var(--font-data);font-size:14px;color:var(--text2)}
.remaining b{font-size:17px;color:var(--good)}
.remaining.over b{color:var(--warn)}
.rm-op{color:var(--text3)}
.mealempty{font-family:var(--font-body);font-size:14px;color:var(--text3);font-style:italic;padding:10px 0 12px}
</style>
</head>

function localDate(d){
  const dt=d||new Date();
  const y=dt.getFullYear();
  const m=String(dt.getMonth()+1).padStart(2,'0');
  const day=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ============ BOOT ============ */
let booting=true, loading=false;
async function boot(){
  if(!configured()){
    E('main').innerHTML=`<div class="setupwarn"><b>Setup needed:</b> open <span style="font-family:'JetBrains Mono',monospace">config.js</span> and paste your Supabase URL and anon key (README, step 3). Then reload.</div>`;
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  // Auth listener handles session changes AFTER the initial boot.
  sb.auth.onAuthStateChange((evt,s)=>{
    const was=!!user;user=s?.user||null;
    if(booting)return; // boot() drives the very first load; ignore events until it's done
    // SIGNED_OUT / TOKEN_REFRESHED / SIGNED_IN all land here after boot.
    if(!!user!==was){ user?loadAll():renderAuth(); }
  });

  // Failsafe: the app must NEVER hang on the loading screen. If session
  // resolution takes too long (stalled network, wedged token in a PWA launch),
  // fall back to the login screen rather than spinning forever.
  let settled=false;
  const failsafe=setTimeout(()=>{
    if(settled)return;
    settled=true;booting=false;
    renderAuth();
  },8000);

  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    user=data?.session?.user||null;
  }catch(err){
    // A stale / expired / "issued in the future" JWT throws here. In a browser
    // you'd hard-refresh to clear it; a PWA can't, so clear it in code and
    // drop the user to a clean login instead of hanging.
    console.warn('Session restore failed, clearing stale token:', err&&err.message);
    try{ await sb.auth.signOut({scope:'local'}); }catch(e){}
    user=null;
  }

  if(settled)return; // failsafe already handled it
  settled=true;clearTimeout(failsafe);
  booting=false;

  try{
    if(user)await loadAll();else renderAuth();
  }catch(err){
    // Absolute last resort — never leave the loading text on screen.
    console.error('Boot load failed:', err);
    renderAuth();
  }
}

async function loadAll(){
  if(loading)return; // prevent concurrent loads racing each other
  loading=true;
  E('main').innerHTML=`<div id="loading">OPENING THE LEDGER…</div>`;
  try{
    const [ex,se,li,wa,we,pr]=await Promise.all([
      sb.from('exercises').select('*').order('position'),
      sb.from('sessions').select('*').order('date'),
      sb.from('lifts').select('*').order('date',{ascending:false}).order('created_at',{ascending:false}),
      sb.from('walks').select('*').order('date'),
      sb.from('weights').select('*').order('date'),
      sb.from('profile').select('*').maybeSingle()
    ]);
    for(const r of [ex,se,li,wa,we])if(r.error)throw r.error;
    PROFILE=pr&&pr.data?pr.data:null;
    // Food tables (added v1.4). Load separately so an un-migrated DB still works.
    try{
      const [fd,fl]=await Promise.all([
        sb.from('foods').select('*').eq('archived',false).order('name'),
        sb.from('food_log').select('*').order('date',{ascending:false})
      ]);
      FOODS=fd.error?[]:(fd.data||[]);
      FOODLOG=fl.error?[]:(fl.data||[]);
      FOOD_TABLES_OK=!fd.error&&!fl.error;
    }catch(e){FOODS=[];FOODLOG=[];FOOD_TABLES_OK=false;}
    EX={a:[],b:[],c:[]};
    ex.data.forEach(r=>{if(EX[r.day])EX[r.day].push(r)});
    // seed defaults on first run
    for(const d of DAYS.slice(0,3)){
      if(!EX[d.id].length){
        const rows=d.defaults.map((name,i)=>({user_id:user.id,day:d.id,name,position:i}));
        const {data,error}=await sb.from('exercises').insert(rows).select();
        if(error)throw error;
        EX[d.id]=data.sort((a,b)=>a.position-b.position);
      }
    }
    SESS={a:[],b:[],c:[]};
    const byId={};
    se.data.forEach(s=>{s.lifts=[];byId[s.id]=s;if(SESS[s.day])SESS[s.day].push(s)});
    LIFTS=li.data;
    li.data.forEach(l=>{if(byId[l.session_id])byId[l.session_id].lifts.push(l)});
    // Sort each session's lifts to match that day's exercise-list order (history ordering fix)
    for(const day of ['a','b','c']){
      const order={};
      EX[day].forEach((ex,i)=>{order[ex.name]=i});
      SESS[day].forEach(s=>{
        s.lifts.sort((x,y)=>{
          const ox=order[x.name]??999, oy=order[y.name]??999;
          return ox-oy;
        });
      });
    }
    WALKS=wa.data;WEIGHTS=we.data;
    render();
  }catch(err){
    E('main').innerHTML=`<div class="setupwarn"><b>Couldn't load:</b> ${err.message||err}. Check that schema.sql ran in Supabase, then reload.</div>`;
  }finally{
    loading=false;
  }
}

/* ============ GLOBAL PROGRESSION ============ */
// increment: per-exercise step (defaults to global INC=5). Deload rounds down to that step.

/* ---- exercise load types ----
   normal     : stack/plate weight. Earn = add weight.
   assisted   : COUNTERWEIGHT (assisted dip/pull-up). More weight = more help.
                Earn = SUBTRACT weight. Deload = ADD weight. Floor at 0.
   bodyweight : no external load. Progression on reps only.            */
function exLoadType(name){
  for(const day of ['a','b','c']){
    const ex=EX[day].find(e=>e.name===name);
    if(ex&&ex.load_type)return ex.load_type;
  }
  // Fallback for exercises not yet migrated: infer from the name.
  if(/assisted/i.test(name))return 'assisted';
  return 'normal';
}
function isAssisted(name){return exLoadType(name)==='assisted';}
function isBodyweight(name){return exLoadType(name)==='bodyweight';}

// Assisted deload = MORE assistance (weight goes UP ~10%, rounded to a step).
function assistDeloadWeight(w,inc){
  const step=inc||INC;
  let c=Math.ceil((w/DELOAD)/step)*step;   // w/0.9 -> ~+11%
  if(c<=w)c=w+step;
  return c;
}

function deloadWeight(w,inc){
  const step=inc||INC;
  let c=Math.floor(w*DELOAD/step)*step;
  if(c>=w)c=w-step;
  return Math.max(c,step);
}

/* ---- achievable weights ----
   Some machines can't make every number. The assisted dip stack is 15 lb plates
   plus a 5 lb add-on, so it can produce 135 and 140 but NOT 130. Snap suggested
   weights onto what the machine can actually select, rounding in the direction
   that matches the intent (harder when earning, easier when deloading). */
function exSteps(name){
  for(const day of ['a','b','c']){
    const ex=EX[day].find(e=>e.name===name);
    if(ex&&ex.plate_step)return {plate:Number(ex.plate_step),aux:Number(ex.aux_step)||0};
  }
  return null;
}
// Every weight the machine can produce, ascending, up to a ceiling.
function achievable(steps,ceiling){
  const out=[];
  for(let n=1;n*steps.plate<=ceiling+steps.plate;n++){
    out.push(n*steps.plate);
    if(steps.aux)out.push(n*steps.plate+steps.aux);
  }
  return out.sort((a,b)=>a-b);
}
// dir: 'down' = pick the largest achievable <= target (never overshoot upward)
//      'up'   = pick the smallest achievable >= target
function snapWeight(target,steps,dir){
  if(!steps||!steps.plate)return target;
  const list=achievable(steps,Math.max(target,0)+steps.plate*2);
  if(dir==='down'){
    const c=list.filter(w=>w<=target);
    return c.length?c[c.length-1]:list[0];
  }
  const c=list.filter(w=>w>=target);
  return c.length?c[0]:list[list.length-1];
}

function exIncrement(name){
  // find the increment configured for this exercise on any day (first match)
  for(const day of ['a','b','c']){
    const ex=EX[day].find(e=>e.name===name);
    if(ex&&ex.increment!=null)return Number(ex.increment);
  }
  return INC;
}
function progression(name){
  const lt=exLoadType(name);

  // --- BODYWEIGHT: no external load. Track reps only. ---
  if(lt==='bodyweight'){
    const bh=LIFTS.filter(l=>l.name===name&&!l.skipped)
      .map(l=>({total:(l.s1||0)+(l.s2||0)+(l.s3||0)})).filter(h=>h.total>0);
    if(!bh.length)return null;
    const lastTotal=bh[0].total;
    return {
      state: lastTotal>=PASS_TOTAL ? 'bw-up' : 'bw-hold',
      suggest: null,          // no weight to suggest
      total: lastTotal, strikes: 0, loadType: 'bodyweight'
    };
  }

  const hist=LIFTS.filter(l=>l.name===name&&!l.skipped&&l.weight!=null).map(l=>({w:Number(l.weight),total:(l.s1||0)+(l.s2||0)+(l.s3||0)})).filter(h=>h.total>0);
  if(!hist.length)return null;
  const inc=exIncrement(name);
  const last=hist[0];
  const assisted=(lt==='assisted');

  const steps=exSteps(name);

  // --- EARNED PROGRESSION ---
  if(last.total>=PASS_TOTAL){
    if(assisted){
      // Less assistance = harder = progress. Floor at 0 (= bodyweight).
      let next=Math.max(0,last.w-inc);
      if(steps&&next>0){
        // Snap DOWN so the step is at least as hard as intended, and never
        // propose a weight the machine can't select.
        next=snapWeight(next,steps,'down');
        if(next>=last.w){                    // already at the lowest reachable step
          const lower=achievable(steps,last.w).filter(w=>w<last.w);
          next=lower.length?lower[lower.length-1]:0;
        }
      }
      return {state:'up',suggest:next,total:last.total,strikes:0,loadType:'assisted',
              graduated: next===0};
    }
    let next=last.w+inc;
    if(steps){
      next=snapWeight(next,steps,'up');
      if(next<=last.w){
        const higher=achievable(steps,last.w+steps.plate*2).filter(w=>w>last.w);
        next=higher.length?higher[0]:next;
      }
    }
    return{state:'up',suggest:next,total:last.total,strikes:0,loadType:lt};
  }

  // --- STRIKES / DELOAD ---
  let strikes=1;
  for(let i=1;i<hist.length;i++){
    if(hist[i].w===last.w&&hist[i].total<PASS_TOTAL)strikes++;else break;
  }
  if(strikes>=STRIKES){
    let back = assisted ? assistDeloadWeight(last.w,inc) : deloadWeight(last.w,inc);
    if(steps){
      // Deload should make it EASIER, so round toward easier: more assistance
      // (up) for assisted machines, less weight (down) for normal ones.
      back = assisted ? snapWeight(back,steps,'up') : snapWeight(back,steps,'down');
      if(assisted&&back<=last.w){
        const higher=achievable(steps,last.w+steps.plate*2).filter(w=>w>last.w);
        back=higher.length?higher[0]:back;
      }
      if(!assisted&&back>=last.w){
        const lower=achievable(steps,last.w).filter(w=>w<last.w);
        back=lower.length?lower[lower.length-1]:back;
      }
    }
    return{state:'deload',suggest:back,total:last.total,strikes,loadType:lt};
  }
  return{state:'hold',suggest:last.w,total:last.total,strikes,loadType:lt};
}

// SVG ring helper. pct 0..1, size px, stroke width, color.
function ringSVG(pct, size, sw, color){
  const r=(size-sw)/2 - 1;
  const circ=2*Math.PI*r;
  const off=circ*(1-Math.max(0,Math.min(1,pct)));
  const cx=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cx}" r="${r}" stroke="var(--track)" stroke-width="${sw}" fill="none"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${cx} ${cx})"/></svg>`;
}

let DRAFTS={}; // per-day in-progress inputs, survive tab switches + edits until logged
// Continuously mirror current lift-day inputs into DRAFTS. Called on every input,
// and before any edit/add/remove/reorder that triggers a re-render. This makes
// data preservation independent of the exact edit sequence (fixes multi-edit loss).
function saveDraft(){
  if(['a','b','c'].includes(active))DRAFTS[active]=grabVals(active);
}
function switchTab(id){
  saveDraft();
  active=id;editMode=false;render();
  if(['a','b','c'].includes(id)&&DRAFTS[id])restoreVals(id,DRAFTS[id]);
}

function wireInputs(){
  const n=EX[active].length;
  const chain=[];
  for(let i=0;i<n;i++)chain.push('s1_'+i,'s2_'+i,'s3_'+i);
  const focusId=id=>{const el=E(id);if(el){el.focus();if(el.select)el.select()}};
  chain.forEach((id,idx)=>{
    const el=E(id);if(!el)return;
    const go=()=>{if(idx+1<chain.length)focusId(chain[idx+1])};
    el.addEventListener('input',()=>{saveDraft();if(el.value.length>=2){go()}});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  });
  for(let i=0;i<n;i++){
    const w=E('w_'+i);if(!w)continue;
    w.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();focusId('s1_'+i)}});
    w.addEventListener('input',saveDraft);
  }
  // mirror every set/warmup field into the draft on change too
  ['s1','s2','s3','ww','wr'].forEach(p=>{for(let i=0;i<n;i++){const el=E(p+'_'+i);if(el)el.addEventListener('input',saveDraft);}});
  const sn=E('sessnote');if(sn)sn.addEventListener('input',saveDraft);
  // warm-up reps also trigger a (shorter) rest
  EX[active]&&EX[active].forEach((ex,i)=>{
    const wr=E('wr_'+i);
    if(wr)wr.addEventListener('input',()=>{ if(wr.value!=='')scheduleWarmupRest(); });
  });
  if(['a','b','c'].includes(active)){scPaintAll();wcPaintAllWarm();}
}



/* ============ SKIP ============
   A skip is NOT a miss. Skipped work is recorded in history for honesty, but
   progression ignores it entirely — no strike, no deload, no weight change. */
let SKIPPED={a:new Set(),b:new Set(),c:new Set()};
function isSkipped(dayId,i){return SKIPPED[dayId]&&SKIPPED[dayId].has(i);}
function toggleSkip(dayId,i){
  const s=SKIPPED[dayId];if(!s)return;
  if(s.has(i)){s.delete(i);}
  else{
    s.add(i);
    // Clear any partially-entered values so a skip is unambiguous.
    ['s1_','s2_','s3_'].forEach(p=>{const el=E(p+i);if(el)el.value='';});
    stopRest(true);            // no rest timer for a skipped exercise
  }
  saveDraft();render();
  if(['a','b','c'].includes(active))scPaintAll();
}
async function skipSession(dayId){
  const reason=prompt('Skipping this workout. Optional note (e.g. "hips sore"):','');
  if(reason===null)return;   // cancelled
  try{

      user_id:user.id, day:dayId, date:today(),
      note:reason.trim()||null, skipped:true, skip_reason:reason.trim()||null

    SKIPPED[dayId]=new Set();
    delete DRAFTS[dayId];
    toast('Rest logged — no strike');
    await loadAll();active='today';render();
  }catch(err){toast('⚠ '+(err.message||err));}
}

/* ============ REST TIMER ============
   Auto-starts after a set is logged. Debounced: each tap resets a 2s window,
   so tapping a circle down from 12 to 7 starts ONE timer when you settle.
   Counts down. Chimes + vibrates at zero. Always dismissible.            */
const REST = {
  normal: 90,     // after a completed working set
  warmup: 60,     // after a warm-up set
  missed: 180,    // after a partial/missed set — you need longer
  debounceMs: 1000
};
let restState = { remaining:0, total:0, tick:null, label:'', running:false };
let restDebounce = null;

// Called by scSet on every set change. val=null means "cleared" -> no timer.
function scheduleRest(val){
  if(val===null||val===undefined)return;          // cleared, not logged
  clearTimeout(restDebounce);
  restDebounce = setTimeout(()=>{
    const missed = Number(val) < TARGET_REPS;
    startRest(missed?REST.missed:REST.normal, missed?'Rest (short set)':'Rest');
  }, REST.debounceMs);
}
function scheduleWarmupRest(){
  clearTimeout(restDebounce);
  restDebounce = setTimeout(()=>startRest(REST.warmup,'Rest (warm-up)'), REST.debounceMs);
}

function startRest(secs,label){
  stopRest(true);                                  // restart cleanly
  // Store the END TIME, not a counter. setInterval is throttled or frozen while
  // the app is backgrounded, so counting down by hand drifts or stalls; deriving
  // from the clock stays correct however long you were away.
  const endAt=Date.now()+secs*1000;
  restState={endAt,total:secs,remaining:secs,tick:null,label:label||'Rest',running:true,fired:false};
  paintRest();
  restState.tick=setInterval(restTick,250);
}
function restTick(){
  if(!restState.running)return;
  const left=Math.ceil((restState.endAt-Date.now())/1000);
  restState.remaining=Math.max(0,left);
  if(left<=0){ if(!restState.fired){restState.fired=true;restDone();} }
  else paintRest();
}
// Recompute the moment we're visible again — covers the backgrounded case where
// timers were frozen entirely.
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)restTick(); });
window.addEventListener('pageshow',()=>{ restTick(); });
function addRest(secs){
  if(!restState.running)return;
  restState.endAt+=secs*1000;restState.total+=secs;restState.fired=false;restTick();
}
function stopRest(quiet){
  if(restState.tick)clearInterval(restState.tick);
  restState.running=false;restState.tick=null;
  const el=E('restbar'); if(el)el.remove();
  if(!quiet){/* user dismissed */}
}
function restDone(){
  if(restState.tick)clearInterval(restState.tick);
  restState.tick=null;restState.remaining=0;
  chime();buzz();
  paintRest(true);
  setTimeout(()=>{ if(!restState.running||restState.remaining<=0)stopRest(true); },4000);
}

function paintRest(done){
  let el=E('restbar');
  if(!el){
    el=document.createElement('div');el.id='restbar';el.className='restbar';
    document.body.appendChild(el);
  }
  const r=Math.max(0,restState.remaining);
  const m=Math.floor(r/60), s=r%60;
  const pct = restState.total? (1 - r/restState.total) : 1;
  el.classList.toggle('done',!!done);
  el.innerHTML=`
    <div class="rb-fill" style="width:${(pct*100).toFixed(1)}%"></div>
    <div class="rb-inner">
      <span class="rb-label">${done?'Rest over':restState.label}</span>
      <span class="rb-time">${done?'0:00':`${m}:${String(s).padStart(2,'0')}`}</span>
      <span class="rb-acts">
        ${done?'':`<button onclick="addRest(30)">+30s</button>`}
        <button onclick="stopRest()">${done?'Dismiss':'Skip'}</button>
      </span>
    </div>`;
}

/* chime: short two-tone beep via Web Audio (plays while the app is open;
   obeys the iPhone silent switch). */
let _audioCtx=null;
function chime(){
  try{
    _audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended')_audioCtx.resume();
    const now=_audioCtx.currentTime;
    [880,1174].forEach((freq,idx)=>{
      const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
      o.type='sine';o.frequency.value=freq;
      const t=now+idx*0.18;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g);g.connect(_audioCtx.destination);
      o.start(t);o.stop(t+0.2);
    });
  }catch(e){/* audio unavailable — silent fail */}
}
function buzz(){ try{ if(navigator.vibrate)navigator.vibrate([120,60,120]); }catch(e){} }

/* ============ SET CIRCLES ============ */
// Backed by hidden inputs s1_i/s2_i/s3_i. Value states:
//   '' (empty/untouched) · number 0..TARGET_REPS
// Interaction: tap = hit target; tap again = count down (wraps); long-press = pad.
let scPressTimer=null, scLongFired=false;
function scGet(i,sn){const el=E('s'+sn+'_'+i);return el&&el.value!==''?Number(el.value):null;}
function scSet(i,sn,val){const el=E('s'+sn+'_'+i);if(el){el.value=(val===null?'':val);}saveDraft();scPaint(i,sn);scheduleRest(val);}
function scPaint(i,sn){
  const btn=E('scbtn_'+i+'_'+sn);if(!btn)return;
  const v=scGet(i,sn);
  btn.classList.remove('done','partial','zero');
  if(v===null){ btn.innerHTML=`<span class="setc-target">${TARGET_REPS}</span>`; }
  else if(v>=TARGET_REPS){ btn.classList.add('done'); btn.textContent=v; }
  else if(v===0){ btn.classList.add('zero'); btn.textContent='0'; }
  else { btn.classList.add('partial'); btn.textContent=v; }
}
function scPaintAll(){
  EX[active].forEach((ex,i)=>{[1,2,3].forEach(sn=>scPaint(i,sn));});
}
function scPress(i,sn){
  scLongFired=false; scCancel();
  scPressTimer=setTimeout(()=>{scLongFired=true;scOpenPad(i,sn);},450);
}
function scRelease(i,sn){
  clearTimeout(scPressTimer);
  if(scLongFired){scLongFired=false;return;}
  scTap(i,sn);
}
function scCancel(){clearTimeout(scPressTimer);}
function scTap(i,sn){
  const v=scGet(i,sn);
  if(v===null){ scSet(i,sn,TARGET_REPS); }        // first tap = hit target
  else if(v===0){ scSet(i,sn,TARGET_REPS); }       // wrap 0 -> target
  else { scSet(i,sn,v-1); }                         // count down
}
/* number pad popover */
let scPad={i:null,sn:null,val:TARGET_REPS};
function scOpenPad(i,sn){
  const cur=scGet(i,sn);
  scPad={i,sn,val:cur!==null?cur:TARGET_REPS};
  let m=E('scpad');

  scRenderPad();
}
function scRenderPad(){
  const m=E('scpad');if(!m)return;
  const ex=EX[active][scPad.i];

    <div class="modal-card scpad-card">
      <div class="scpad-head">
        <div class="scpad-ex">${ex?ex.name:''}</div>

      </div>
      <div class="scpad-stepper">
        <button class="scpad-step" onclick="scStep(-1)">−</button>
        <div class="scpad-val">${scPad.val}</div>
        <button class="scpad-step" onclick="scStep(1)">+</button>
      </div>
      <div class="scpad-grid">
        ${nums.map(n=>`<button class="scpad-key ${n===scPad.val?'sel':''}" onclick="scPadSet(${n})">${n}</button>`).join('')}
      </div>
      <button class="btn" onclick="scPadCommit()">Log it</button>
      <button class="del" style="display:block;margin:8px auto 4px" onclick="scPadClear()">Clear this set</button>
    </div>`;
}
function scStep(d){scPad.val=Math.max(0,scPad.val+d);scRenderPad();}
function scPadSet(n){scPad.val=n;scRenderPad();}
function scPadCommit(){scSet(scPad.i,scPad.sn,scPad.val);scClosePad();}
function scPadClear(){scSet(scPad.i,scPad.sn,null);scClosePad();}
function scClosePad(){const m=E('scpad');if(m)m.remove();}

async function doAddExercise(dayId,name,inc){
  const pos=EX[dayId].length?Math.max(...EX[dayId].map(e=>e.position))+1:0;
  const {data,error}=await sb.from('exercises').insert({user_id:user.id,day:dayId,name,position:pos,increment:inc||5}).select();

/* ============ REORDER ============ */
async function moveEx(dayId,i,dir){
  saveDraft();
  const j=i+dir;
  const list=EX[dayId];
  if(j<0||j>=list.length)return;
  // swap positions in array
  [list[i],list[j]]=[list[j],list[i]];
  // persist new position values (use array index as canonical position)
  const updates=list.map((ex,idx)=>({id:ex.id,position:idx}));
  for(const u of updates){ex_pos_cache(u.id,u.position);}
  // remap the draft keys are name-based, so they follow automatically
  render();
  if(DRAFTS[dayId])restoreVals(dayId,DRAFTS[dayId]);
  // fire off position updates (fire-and-forget, they're independent rows)
  try{
    await Promise.all(updates.map(u=>sb.from('exercises').update({position:u.position}).eq('id',u.id)));
  }catch(e){toast('⚠ order not saved: '+(e.message||e));}
}
function ex_pos_cache(id,pos){
  for(const d of ['a','b','c']){const ex=EX[d].find(e=>e.id===id);if(ex)ex.position=pos;}
}
/* ============ COPY DAY ============ */
async function copyDayPrompt(dayId){
  const others=['a','b','c'].filter(d=>d!==dayId);
  const labels={a:'Day A',b:'Day B',c:'Day C'};
  const target=others.length===2
    ? (prompt(`Copy ${labels[dayId]}'s exercises to which day? Type A, B, or C.`,'')||'').trim().toLowerCase()
    : others[0];
  if(!['a','b','c'].includes(target)||target===dayId){toast('Copy cancelled');return}
  if(!confirm(`This REPLACES all exercises on ${labels[target]} with a copy of ${labels[dayId]}. Logged history is untouched. Continue?`))return;
  try{
    // delete target's current exercise rows
    const delIds=EX[target].map(e=>e.id);
    if(delIds.length){const {error}=await sb.from('exercises').delete().in('id',delIds);if(error)throw error;}
    // clone source rows into target
    const rows=EX[dayId].map((ex,idx)=>({user_id:user.id,day:target,name:ex.name,position:idx,increment:ex.increment??5,warmup:!!ex.warmup}));
    const {data,error}=await sb.from('exercises').insert(rows).select();
    if(error)throw error;
    EX[target]=data.sort((a,b)=>a.position-b.position);
    toast(`Copied ${labels[dayId]} → ${labels[target]} ✓`);
  }catch(e){toast('⚠ copy failed: '+(e.message||e));}
}

async function applySwap(name,inc){

  // so logging records it under the alternate's real name and its own progression builds.
  const dayId=pickerDay,i=swapIndex;

async function logSession(dayId){
  const lifts=[];
  EX[dayId].forEach((ex,i)=>{
    if(isSkipped(dayId,i)){
      // Recorded for honest history; progression ignores skipped rows entirely.
      lifts.push({name:ex.name,weight:null,s1:null,s2:null,s3:null,warmup_weight:null,warmup_reps:null,skipped:true});
      return;
    }
    const w=E('w_'+i)?.value,s1=E('s1_'+i)?.value,s2=E('s2_'+i)?.value,s3=E('s3_'+i)?.value;
    const ww=E('ww_'+i)?.value,wr=E('wr_'+i)?.value;
    if(w||s1||s2||s3||ww||wr)lifts.push({name:ex.name,weight:w?Number(w):null,s1:s1?Number(s1):null,s2:s2?Number(s2):null,s3:s3?Number(s3):null,warmup_weight:ww?Number(ww):null,warmup_reps:wr?Number(wr):null,skipped:false});
  });
  if(!lifts.some(l=>!l.skipped)){toast('Nothing entered yet');return}
  const btn=E('logbtn');btn.disabled=true;
  try{
    const note=E('sessnote').value.trim()||null;
    const date=today();
    const {data:sess,error:e1}=await sb.from('sessions').insert({user_id:user.id,day:dayId,date,note}).select();
    if(e1)throw e1;
    const rows=lifts.map(l=>({user_id:user.id,session_id:sess[0].id,date,day:dayId,...l}));
    const {error:e2}=await sb.from('lifts').insert(rows);
    if(e2)throw e2;
    delete DRAFTS[dayId];SKIPPED[dayId]=new Set();
    toast('Session logged ✓ (saved to database)');
    await loadAll();
  }catch(err){toast('⚠ NOT saved: '+(err.message||err));btn.disabled=false}
}

function weekWalks(){
  const now=new Date();const sun=new Date(now);sun.setDate(now.getDate()-now.getDay());sun.setHours(0,0,0,0); // Sunday start
  let count=0,mins=0,miles=0,cals=0;
  WALKS.forEach(w=>{const d=new Date(w.date+'T12:00');if(d>=sun){count++;mins+=w.mins||0;miles+=Number(w.dist)||0;cals+=w.cal||0}});
  return{count,mins,miles,cals};
}

function prevVal(field,before){for(let i=before-1;i>=0;i--){if(WEIGHTS[i][field]!=null)return WEIGHTS[i][field]}return null}
function weightView(){
  const ws=WEIGHTS;

      h+=`<div style="margin-top:8px"><span class="daymeta">WAIST </span><span style="font-family:'IBM Plex Mono',monospace;font-weight:600">${lw.v}"</span>`;

  if(!list.length)h+=`<div class="empty">No entries yet. Same scale, same time of day. Weekly waist, monthly arm is plenty.</div>`;
  else h+=list.slice(0,20).map((e)=>{

}

// Minimal SVG line chart (moss/brass). points:[{x:Date-ish label, y:number}]
function lineChart(svgId,series,opts){
  const svg=E(svgId);if(!svg)return;
  const W=320,H=160,pad={l:34,r:10,t:12,b:22};
  const pts=series.filter(p=>p.y!=null&&!isNaN(p.y));
  if(pts.length<1){svg.innerHTML=`<text x="${W/2}" y="${H/2}" fill="#86868F" font-size="11" font-family="monospace" text-anchor="middle">no data yet</text>`;return;}
  let ys=pts.map(p=>p.y);
  let ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(opts&&opts.goal!=null){ymin=Math.min(ymin,opts.goal);ymax=Math.max(ymax,opts.goal);}
  if(ymin===ymax){ymin-=1;ymax+=1;}
  const padY=(ymax-ymin)*0.15||1;ymin-=padY;ymax+=padY;
  const plotW=W-pad.l-pad.r,plotH=H-pad.t-pad.b;
  const xFor=i=>pad.l+(pts.length===1?plotW/2:(i/(pts.length-1))*plotW);
  const yFor=v=>pad.t+plotH-((v-ymin)/(ymax-ymin))*plotH;
  let g='';
  // gridlines + y labels (3)
  for(let k=0;k<=2;k++){
    const v=ymin+(k/2)*(ymax-ymin);const y=yFor(v);
    g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#34343C" stroke-width="0.5"/>`;
    g+=`<text x="${pad.l-4}" y="${y+3}" fill="#86868F" font-size="8" font-family="monospace" text-anchor="end">${(Math.round(v*10)/10)}</text>`;
  }
  // goal line
  if(opts&&opts.goal!=null){
    const gy=yFor(opts.goal);
    g+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="#FF3B30" stroke-width="1" stroke-dasharray="3 3"/>`;
    g+=`<text x="${W-pad.r}" y="${gy-3}" fill="#FF3B30" font-size="8" font-family="monospace" text-anchor="end">goal ${opts.goal}</text>`;
  }
  // line path
  const d=pts.map((p,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yFor(p.y).toFixed(1)}`).join(' ');
  g+=`<path d="${d}" fill="none" stroke="#FF3B30" stroke-width="2"/>`;
  // dots
  pts.forEach((p,i)=>{g+=`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.y).toFixed(1)}" r="2.5" fill="#F5F5F7"/>`;});
  // x labels: first & last
  g+=`<text x="${pad.l}" y="${H-6}" fill="#86868F" font-size="8" font-family="monospace">${pts[0].x}</text>`;
  if(pts.length>1)g+=`<text x="${W-pad.r}" y="${H-6}" fill="#86868F" font-size="8" font-family="monospace" text-anchor="end">${pts[pts.length-1].x}</text>`;
  svg.innerHTML=g;
}
function barChart(svgId,bars){
  const svg=E(svgId);if(!svg)return;
  const W=320,H=160,pad={l:34,r:10,t:12,b:22};
  const vals=bars.filter(b=>b.y!=null);
  if(!vals.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" fill="#86868F" font-size="11" font-family="monospace" text-anchor="middle">no data yet</text>`;return;}
  const ymax=Math.max(...vals.map(b=>b.y))*1.15||1;
  const plotW=W-pad.l-pad.r,plotH=H-pad.t-pad.b;
  const bw=plotW/vals.length*0.6,gap=plotW/vals.length;
  let g='';
  for(let k=0;k<=2;k++){
    const v=(k/2)*ymax;const y=pad.t+plotH-(v/ymax)*plotH;
    g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#34343C" stroke-width="0.5"/>`;
    g+=`<text x="${pad.l-4}" y="${y+3}" fill="#86868F" font-size="8" font-family="monospace" text-anchor="end">${Math.round(v)}</text>`;
  }
  vals.forEach((b,i)=>{
    const x=pad.l+i*gap+(gap-bw)/2;
    const bh=(b.y/ymax)*plotH;
    g+=`<rect x="${x.toFixed(1)}" y="${(pad.t+plotH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#FF3B30" rx="1"/>`;
  });
  g+=`<text x="${pad.l}" y="${H-6}" fill="#86868F" font-size="8" font-family="monospace">${vals[0].x}</text>`;
  if(vals.length>1)g+=`<text x="${W-pad.r}" y="${H-6}" fill="#86868F" font-size="8" font-family="monospace" text-anchor="end">${vals[vals.length-1].x}</text>`;
  svg.innerHTML=g;
}
function isoWeek(d){
  const dt=new Date(d+'T12:00');dt.setDate(dt.getDate()-dt.getDay());return localDate(dt).slice(5); // Sunday start
}
function drawCharts(){
  // Strength: max weight per session date for chosen exercise
  if(trendExercise){
    const byDate={};
    LIFTS.filter(l=>l.name===trendExercise&&l.weight!=null).forEach(l=>{
      if(!byDate[l.date]||Number(l.weight)>byDate[l.date])byDate[l.date]=Number(l.weight);
    });
    const pts=Object.keys(byDate).sort().map(d=>({x:fmtShort(d),y:byDate[d]}));
    lineChart('chart_strength',pts);
  }
  // Bodyweight
  lineChart('chart_weight',WEIGHTS.map(w=>({x:fmtShort(w.date),y:Number(w.lbs)})),{goal:PROFILE?.goal_weight?Number(PROFILE.goal_weight):null});
  // Body fat
  lineChart('chart_bf',WEIGHTS.filter(w=>w.bf!=null).map(w=>({x:fmtShort(w.date),y:Number(w.bf)})));
  // Waist
  lineChart('chart_waist',WEIGHTS.filter(w=>w.waist!=null).map(w=>({x:fmtShort(w.date),y:Number(w.waist)})),{goal:PROFILE?.goal_waist?Number(PROFILE.goal_waist):null});
  // Walking calories per week
  const wk={};
  WALKS.forEach(w=>{if(w.cal){const k=isoWeek(w.date);wk[k]=(wk[k]||0)+Number(w.cal);}});
  barChart('chart_walk',Object.keys(wk).sort().map(k=>({x:k,y:wk[k]})));
}
function fmtShort(s){const d=new Date(s+'T12:00');return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}

// Nutrient definitions: key, label, unit, whether always-shown
const NUTRIENTS=[
  {k:'calories',label:'Calories',unit:'',core:true},
  {k:'protein',label:'Protein',unit:'g',core:true},
  {k:'carbs',label:'Carbs',unit:'g',core:true},
  {k:'fat',label:'Fat',unit:'g',core:true},
  {k:'fiber',label:'Fiber',unit:'g',core:true},
  {k:'sodium',label:'Sodium',unit:'mg',core:false},
  {k:'added_sugar',label:'Added sugar',unit:'g',core:false},
  {k:'sat_fat',label:'Sat fat',unit:'g',core:false},
  {k:'cholesterol',label:'Cholesterol',unit:'mg',core:false},
  {k:'potassium',label:'Potassium',unit:'mg',core:false}
];
function nutrientPrefs(){
  // which optional nutrients are toggled on
  const p=PROFILE&&PROFILE.nutrient_prefs;
  if(Array.isArray(p))return p;
  try{return JSON.parse(p||'[]')}catch(e){return []}
}
function visibleNutrients(){
  const opt=nutrientPrefs();
  return NUTRIENTS.filter(n=>n.core||opt.includes(n.k));
}
function foodToday(){return foodDate||today()}
function dayEntries(d){return FOODLOG.filter(e=>e.date===d)}
function dayTotals(d){
  const t={};NUTRIENTS.forEach(n=>t[n.k]=0);
  dayEntries(d).forEach(e=>{NUTRIENTS.forEach(n=>{t[n.k]+=Number(e[n.k])||0})});
  return t;
}
// Weekly food totals for the week containing date `d` (Monday start), mirroring weekWalks.
function weekFood(d){
  const base=new Date((d||foodToday())+'T12:00');
  const sun=new Date(base);sun.setDate(base.getDate()-base.getDay());sun.setHours(0,0,0,0); // Sunday start
  const sat=new Date(sun);sat.setDate(sun.getDate()+6);sat.setHours(23,59,59,999);
  const t={};NUTRIENTS.forEach(n=>t[n.k]=0);
  const daysLogged=new Set();
  FOODLOG.forEach(e=>{
    const ed=new Date(e.date+'T12:00');
    if(ed>=sun&&ed<=sat){NUTRIENTS.forEach(n=>{t[n.k]+=Number(e[n.k])||0});daysLogged.add(e.date);}
  });
  return{totals:t,days:daysLogged.size,sun:localDate(sun),sat:localDate(sat)};
}

const MEAL_SLOTS=['Breakfast','Lunch','Dinner','Snack','Unsorted'];


/* ============ CALORIE CALCULATOR ============
   Mifflin-St Jeor BMR -> activity factor -> TDEE -> goal adjustment.
   These are ESTIMATES (±10% individually is normal), so the UI says so and
   shows the projected weekly change rather than hiding it behind a percentage. */
let calcState={sex:'male',age:null,heightIn:null,weight:null,activity:1.55,goal:'modest'};
const ACTIVITY=[
  [1.2,'Sedentary','desk job, little exercise'],
  [1.375,'Light','light exercise 1–3 days/wk'],
  [1.55,'Moderate','exercise 3–5 days/wk'],
  [1.725,'Very active','hard exercise 6–7 days/wk'],
];
const GOALS=[
  ['maintain','Maintenance',0],
  ['modest','Modest deficit',-0.175],
  ['intense','Intense deficit',-0.25],
  ['gain','Gain',0.125],
];
function openCalc(){
  const p=PROFILE||{};
  const lastW=(WEIGHTS&&WEIGHTS.length)?Number(WEIGHTS[WEIGHTS.length-1].lbs):null;
  calcState={
    sex:calcState.sex||'male',
    age:p.age||calcState.age||null,
    heightIn:p.height_in||calcState.heightIn||null,
    weight:lastW||p.start_weight||calcState.weight||null,
    activity:calcState.activity||1.55,
    goal:calcState.goal||'modest',
  };
  renderCalc();
}
function calcResult(){
  const s=calcState;
  if(!s.age||!s.heightIn||!s.weight)return null;
  const kg=s.weight*0.45359237, cm=s.heightIn*2.54;
  // Mifflin-St Jeor
  let bmr=10*kg+6.25*cm-5*s.age;
  bmr+= (s.sex==='female' ? -161 : 5);
  const tdee=bmr*s.activity;
  const g=GOALS.find(x=>x[0]===s.goal)||GOALS[0];
  let target=tdee*(1+g[2]);
  // Floor: never propose an unreasonably low intake.
  const floor=s.sex==='female'?1200:1500;
  const floored=target<floor;
  if(floored)target=floor;
  const deltaPerDay=target-tdee;
  const lbsPerWeek=(deltaPerDay*7)/3500;
  // Macros: protein from bodyweight (muscle preservation), fat 25%, carbs rest.
  const protein=Math.round(s.weight*0.8);
  const fat=Math.round(target*0.25/9);
  const carbs=Math.round((target-protein*4-fat*9)/4);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),target:Math.round(target),
          lbsPerWeek,floored,protein,fat,carbs:Math.max(0,carbs)};
}
function renderCalc(){
  let m=E('calcmodal');
  if(!m){m=document.createElement('div');m.id='calcmodal';m.className='modal';document.body.appendChild(m);}
  const s=calcState, r=calcResult();
  m.innerHTML=`<div class="modal-bg" onclick="closeCalc()"></div>
    <div class="modal-card">
      <div class="pk-head">
        <b style="font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.5px;flex:1">Calculate targets</b>
        <button class="pk-close" onclick="closeCalc()">✕</button>
      </div>
      <div class="pk-list">
        <div class="fields">
          <div class="field"><label>Age</label><input type="number" inputmode="numeric" id="c_age" value="${s.age||''}"></div>
          <div class="field"><label>Height (in)</label><input type="number" inputmode="numeric" id="c_ht" value="${s.heightIn||''}"></div>
          <div class="field"><label>Weight (lb)</label><input type="number" inputmode="decimal" id="c_wt" value="${s.weight||''}"></div>
        </div>
        <div class="profilefield" style="margin-top:14px">
          <label>Sex (for the BMR formula)</label>
          <div class="mealpick">
            ${['male','female'].map(x=>`<button class="mp ${s.sex===x?'on':''}" onclick="calcState.sex='${x}';renderCalc()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
          </div>
        </div>
        <div class="profilefield">
          <label>Activity</label>
          ${ACTIVITY.map(([v,lab,desc])=>`<button class="calcopt ${s.activity===v?'on':''}" onclick="calcState.activity=${v};renderCalc()">
            <b>${lab}</b><span>${desc}</span></button>`).join('')}
        </div>
        <div class="profilefield">
          <label>Goal</label>
          ${GOALS.map(([k,lab])=>`<button class="calcopt ${s.goal===k?'on':''}" onclick="calcState.goal='${k}';renderCalc()">
            <b>${lab}</b></button>`).join('')}
        </div>
        ${r?`
        <div class="ringcard" style="text-align:left;padding:16px">
          <div class="dc-sub">Maintenance ≈ ${r.tdee.toLocaleString()} cal/day</div>
          <div class="dc-big" style="margin-top:6px">${r.target.toLocaleString()}<span style="font-size:15px;color:var(--text2)"> cal/day</span></div>
          <div class="dc-sub" style="margin-top:4px">
            ${Math.abs(r.lbsPerWeek)<0.05?'holding steady':

        </div>

        <button class="btn" onclick="applyCalc()">Use these targets</button>

}

/* ---- logging history: what you actually eat, ready to re-log in one tap ----
   Recent = last logged, newest first. Frequent = most logged, all time.
   Both are derived from food_log, deduplicated by name, and carry the servings
   and meal you used last time so a single tap reproduces it exactly. */
function historyItems(){
  const byName=new Map();
  (FOODLOG||[]).forEach(e=>{
    const key=(e.name||'').trim().toLowerCase();
    if(!key)return;
    const prev=byName.get(key);
    const when=e.date||'';
    if(!prev){
      byName.set(key,{name:e.name,count:1,last:when,row:e});
    }else{
      prev.count++;
      if(when>prev.last){prev.last=when;prev.row=e;}
    }
  });
  return [...byName.values()];
}
// Turn a past log row into something the picker can render and re-log.
function historyRow(h){
  const e=h.row;
  const q=Number(e.qty)||1;
  const per={};
  NUTRIENTS.forEach(n=>{per[n.k]=(Number(e[n.k])||0)/(q||1);});
  return {
    id:'hist-'+e.id,
    name:e.name,
    brand:null,
    serving:e.serving_label||'1 serving',
    per:'serving',
    nutrients:per,
    source:e.confidence==='estimated'?'estimate':
           e.confidence==='published'?'web':
           e.confidence==='verified'?'usda':'yours',
    sourceLabel:e.confidence==='published'?(e.source_url?hostOfUrl(e.source_url):'Brand site'):
                e.confidence==='estimated'?'~ Estimate':
                e.confidence==='verified'?'Verified':'Yours',
    sourceUrl:e.source_url||null,
    _lastQty:q,
    _lastMeal:e.meal_slot||'',
    _fromHistory:true,
    _foodId:e.food_id||null
  };
}
function hostOfUrl(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return 'source';}}

function stapleToRow(f){
  return {
    id:'staple-'+f.id, name:f.name, brand:null,
    serving:f.serving||'1 serving', per:'serving',
    nutrients:Object.fromEntries(NUTRIENTS.map(n=>[n.k,Number(f[n.k])||0])),
    source:'staple', sourceLabel:'Saved', sourceUrl:null,
    _stapleId:f.id, _lastQty:1, _lastMeal:''
  };
}

/* ============ FOOD PICKER — one search, one list ============
   Every row carries where its numbers came from. Databases answer instantly;
   brand-website and estimate tiers are fetched separately and appended as they
   arrive, so the slow paths never block the fast ones.                     */
let fpQuery='';
let fpRows=[];                 // flat, ordered, each with .source
let fpState='idle';            // idle | loading | done | error
let fpErr='';
let fpPage=0, fpHasMore=false, fpMoreLoading=false;
let fpAiState='';              // '' | 'web' | 'estimate' | 'done'
let fpSeq=0;                   // guards against out-of-order responses
let fpInterp=null, fpLastDbQuery='', fpPresetMeal='';

function openFoodPicker(presetMeal){
  fpPresetMeal=presetMeal||'';
  fpQuery='';fpRows=[];fpState='idle';fpErr='';
  fpPage=0;fpHasMore=false;fpMoreLoading=false;fpAiState='';fpInterp=null;fpLastDbQuery='';
  renderFoodPicker();
}
function closeFoodPicker(){const m=E('foodpicker');if(m)m.remove();}

function renderFoodPicker(){
  const prev=E('fp_list');
  const scroll=prev?prev.scrollTop:0;
  let m=E('foodpicker');
  if(!m){m=document.createElement('div');m.id='foodpicker';m.className='modal';document.body.appendChild(m);}
  m.innerHTML=`<div class="modal-bg" onclick="closeFoodPicker()"></div>
    <div class="modal-card">
      <div class="pk-head">
        <input type="text" id="fp_q" placeholder="Search foods…" value="${escAttr(fpQuery)}"
               autocomplete="off" enterkeyhint="search">
        <button class="pk-close" onclick="closeFoodPicker()">✕</button>
      </div>
      <div class="pk-list" id="fp_list">${fpBody()}</div>
    </div>`;
  const nl=E('fp_list');if(nl&&scroll)nl.scrollTop=scroll;
  const si=E('fp_q');
  if(si){
    si.oninput=()=>{fpQuery=si.value;};
    si.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();runFoodSearch();}};
    si.focus();si.setSelectionRange(si.value.length,si.value.length);
  }
}

function fpBody(){
  // Before typing: your own history. This is where most logging happens, so
  // every row is ONE TAP to log with the servings and meal you used last time.
  if(fpState==='idle'){
    const hist=historyItems();
    const recent=hist.slice().sort((a,b)=>(b.last||'').localeCompare(a.last||'')).slice(0,15);
    const recentIds=new Set(recent.map(h=>h.name.toLowerCase()));
    const frequent=hist.filter(h=>h.count>1&&!recentIds.has(h.name.toLowerCase()))
                       .sort((a,b)=>b.count-a.count).slice(0,10);
    const staples=(FOODS||[]).filter(f=>!f.archived);

    let out='';
    if(!recent.length&&!staples.length){
      return `<div class="pk-empty" style="font-style:normal">
        Describe what you ate, or search for a food.
        <div style="margin-top:14px;font-size:13px;color:var(--text3)">Once you've logged a few things they'll show up here for one-tap logging.</div>
      </div>`;
    }
    if(recent.length){
      out+=`<div class="pk-cat">Recent</div>`;
      out+=recent.map(h=>histCard(historyRow(h))).join('');
    }
    if(frequent.length){
      out+=`<div class="pk-cat">Frequent</div>`;
      out+=frequent.map(h=>histCard(historyRow(h))).join('');
    }
    if(staples.length){
      out+=`<div class="pk-cat">Saved</div>`;
      out+=staples.map(f=>histCard(stapleToRow(f))).join('');
    }
    out+=`<div class="fp-hint">Tap to log · press and hold to adjust first</div>`;
    return out;
  }
  if(fpState==='error')return `<div class="pk-empty">⚠ ${escHtml(fpErr||'Search failed')}
      <div style="margin-top:12px"><button class="btn ghost" style="max-width:160px" onclick="runFoodSearch()">Try again</button></div></div>`;
  if(fpState==='loading'&&!fpRows.length)return `<div class="fp-status">Searching…</div>`;

  let out='';
  if(fpRows.length){
    out+=fpRows.map(r=>rowCard(r)).join('');
  }
  // Progressive status for the slower tiers.
  if(fpAiState==='web')out+=`<div class="fp-status">Checking the brand's website…</div>`;
  else if(fpAiState==='estimate')out+=`<div class="fp-status">Estimating…</div>`;

  if(!fpRows.length&&fpAiState==='done')
    out+=`<div class="pk-empty">Nothing found for “${escHtml(fpQuery)}”.
      <div style="margin-top:12px"><button class="btn ghost" style="max-width:200px" onclick="addManualFromQuery()">Enter it manually</button></div></div>`;

  if(fpRows.length){
    out+=`<div class="pk-more">`;
    if(fpMoreLoading)out+=`<div class="pk-empty" style="padding:10px 0">Loading…</div>`;
    else if(fpHasMore)out+=`<button class="btn ghost" onclick="runFoodSearch(true)">Show more</button>
      <div class="fp-count">${fpRows.length} shown</div>`;
    out+=`<button class="btn ghost" style="margin-top:8px" onclick="addManualFromQuery()">Enter manually</button></div>`;
  }
  return out;
}


/* History rows log in ONE TAP. Long-press opens the confirm sheet instead. */
let histPressTimer=null, histLong=false;
function histCard(r){
  const n=r.nutrients||{};
  const q=r._lastQty||1;
  const meal=r._lastMeal?` · ${escHtml(r._lastMeal)}`:'';
  HISTROWS[r.id]=r;
  return `<button class="foodrow hist" id="hr_${r.id}"
      onpointerdown="histPress('${r.id}')" onpointerup="histRelease('${r.id}')" onpointerleave="histCancel()">
    <div class="fr-top">
      <span class="fr-name">${escHtml(r.name)}</span>
      ${srcBadge(r)}
    </div>
    <div class="fr-macros">${Math.round((n.calories||0)*q)} cal · ${Math.round((n.protein||0)*q)}g P · ${Math.round((n.carbs||0)*q)}g C · ${Math.round((n.fat||0)*q)}g F
      <span class="fr-per">${q!==1?`· ${q} servings`:''}${meal}</span></div>
  </button>`;
}
const HISTROWS={};
function histPress(id){histLong=false;histCancel();histPressTimer=setTimeout(()=>{histLong=true;openHistDetail(id);},450);}
function histRelease(id){clearTimeout(histPressTimer);if(histLong){histLong=false;return;}quickLog(id);}
function histCancel(){clearTimeout(histPressTimer);}
function openHistDetail(id){
  const r=HISTROWS[id];if(!r)return;
  fpDetail=r;fpServings=r._lastQty||1;fpMeal=fpPresetMeal||r._lastMeal||'';
  renderFoodDetail();
}
// One tap: log it exactly as last time.
async function quickLog(id){
  const r=HISTROWS[id];if(!r)return;
  const n=r.nutrients||{};
  const q=r._lastQty||1;
  const meal=fpPresetMeal||r._lastMeal||null;

    name:r.name,meal_slot:meal,qty:q,

    confidence:confOf(r.source),source_url:r.sourceUrl||null};

  const {error}=await sb.from('food_log').insert(row);

  toast(`Logged ${r.name}`);
